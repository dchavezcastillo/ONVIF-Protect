# DVR, NVR, or camera from any brand exposing RTSP/TCP.
# Replace the host, path, and video parameters with your device settings.
# The source does not need ONVIF support or event credentials.
onvif:
  - name: Channel 1
    mac: a2:a2:a2:a2:a2:a1
    uuid: 15b21259-77d9-441f-9913-3ccd8a82e430
    ports: { server: 8081, rtsp: 8554 }
    highQuality:
      rtsp: /actual/stream/path
      width: 1920
      height: 1080
      framerate: 15
      bitrate: 2048
      quality: 4
    # Optional: add lowQuality if a substream is available.
    # Without a snapshot path, the included fallback image is used.
    # For live images at the /snapshot.png URL, configure a snapshot
    # path and both snapshot ports, plus snapshotAuth for protected sources:
    # snapshotAuth:
    #   usernameEnv: SNAPSHOT_USERNAME
    #   passwordEnv: SNAPSHOT_PASSWORD
    target:
      hostname: 192.168.1.200
      # Optional independent image source; RTSP continues using hostname.
      # snapshotHostname: 192.168.1.104
      ports: { rtsp: 554 }
